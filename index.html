<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<meta name="color-scheme" content="light dark">
<title>Новое обращение КЦ</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cg transform='translate(14 14) scale(1.5)' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3 14v-2a9 9 0 0 1 18 0v2'/%3E%3Cpath d='M21 15a2 2 0 0 1-2 2h-1v-5h1a2 2 0 0 1 2 2zM3 15a2 2 0 0 0 2 2h1v-5H5a2 2 0 0 0-2 2z'/%3E%3Cpath d='M21 17v1a3 3 0 0 1-3 3h-4'/%3E%3C/g%3E%3C/svg%3E">

<script>
// Применяем тему до отрисовки, чтобы не было мигания
(function () {
  var t = null;
  try { t = localStorage.getItem('kc_theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') {
    t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#0b1020' : '#6366f1');
})();
</script>

<style>
:root{
  color-scheme:light;
  --primary:#6366f1; --primary-2:#8b5cf6; --primary-dark:#4f46e5;
  --page-bg:#eef2ff;
  --glow-1:rgba(99,102,241,.35); --glow-2:rgba(139,92,246,.30);
  --card:#ffffff; --text:#1e293b; --label:#334155; --muted:#64748b;
  --border:#e2e8f0; --input-bg:#f8fafc; --input-focus:#ffffff;
  --danger:#ef4444; --danger-bg:#fef2f2; --ok:#10b981;
  --chip-bg:#eef2ff; --chip-bg-hover:#e0e7ff; --chip-text:#4f46e5;
  --ghost-bg:#f1f5f9; --ghost-hover:#e2e8f0; --ghost-text:#475569;
  --remove-bg:#fee2e2; --remove-hover:#fecaca; --remove-text:#dc2626;
  --summary-bg:#f8fafc; --overlay:rgba(15,23,42,.55);
  --shadow:0 25px 60px rgba(79,70,229,.18), 0 6px 18px rgba(15,23,42,.08);
  --ring:rgba(99,102,241,.16);
}
[data-theme="dark"]{
  color-scheme:dark;
  --page-bg:#0b1020;
  --glow-1:rgba(99,102,241,.40); --glow-2:rgba(139,92,246,.30);
  --card:#151b2e; --text:#e5e7eb; --label:#cbd5e1; --muted:#94a3b8;
  --border:#2a3350; --input-bg:#0f1527; --input-focus:#121a30;
  --danger:#f87171; --danger-bg:rgba(239,68,68,.12); --ok:#34d399;
  --chip-bg:rgba(99,102,241,.16); --chip-bg-hover:rgba(99,102,241,.28); --chip-text:#a5b4fc;
  --ghost-bg:#1e2742; --ghost-hover:#27325a; --ghost-text:#cbd5e1;
  --remove-bg:rgba(239,68,68,.16); --remove-hover:rgba(239,68,68,.28); --remove-text:#fca5a5;
  --summary-bg:#0f1527; --overlay:rgba(2,6,23,.72);
  --shadow:0 25px 60px rgba(0,0,0,.55);
  --ring:rgba(129,140,248,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; min-height:100dvh;
  padding:clamp(12px,3vw,32px);
  padding-left:max(clamp(12px,3vw,32px), env(safe-area-inset-left));
  padding-right:max(clamp(12px,3vw,32px), env(safe-area-inset-right));
  padding-bottom:max(clamp(12px,3vw,32px), env(safe-area-inset-bottom));
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(900px 520px at 5% -10%, var(--glow-1), transparent 60%),
    radial-gradient(800px 520px at 100% 110%, var(--glow-2), transparent 60%),
    var(--page-bg);
  background-attachment:fixed;
  color:var(--text);
  display:flex; justify-content:center; align-items:flex-start;
  transition:background-color .3s, color .3s;
}
.container{
  width:100%; max-width:720px; margin:auto;
  background:var(--card); border-radius:clamp(16px,3vw,24px);
  box-shadow:var(--shadow); overflow:hidden;
  border:1px solid var(--border);
  transition:background-color .3s, border-color .3s;
}

/* Шапка */
.header{
  display:flex; align-items:center; gap:14px;
  padding:clamp(18px,4vw,28px) clamp(16px,4vw,32px);
  color:#fff; position:relative; overflow:hidden;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
}
.header::after{
  content:""; position:absolute; right:-40px; top:-60px; width:200px; height:200px; border-radius:50%;
  background:rgba(255,255,255,.12); pointer-events:none;
}
.logo{
  flex:0 0 auto; width:clamp(44px,9vw,54px); height:clamp(44px,9vw,54px); border-radius:16px;
  background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.35);
  display:flex; align-items:center; justify-content:center;
  backdrop-filter:blur(4px); box-shadow:0 6px 16px rgba(0,0,0,.15);
}
.logo svg{width:60%;height:60%}
.header-text{flex:1;min-width:0;position:relative;z-index:1}
.header h1{margin:0 0 2px;font-size:clamp(18px,4.6vw,24px);font-weight:700;line-height:1.2}
.header p{margin:0;opacity:.88;font-size:clamp(12px,3.2vw,14px);line-height:1.35}

.theme-toggle{
  flex:0 0 auto; position:relative; z-index:1;
  width:44px; height:44px; border-radius:14px; cursor:pointer; color:#fff;
  background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.35);
  display:flex; align-items:center; justify-content:center;
  transition:background .2s, transform .15s;
}
.theme-toggle:hover{background:rgba(255,255,255,.3)}
.theme-toggle:active{transform:scale(.92)}
.theme-toggle:focus-visible{outline:3px solid rgba(255,255,255,.7);outline-offset:2px}
.theme-toggle svg{width:22px;height:22px;position:absolute;transition:transform .45s cubic-bezier(.4,1.4,.5,1), opacity .25s}
.theme-toggle .moon{opacity:0;transform:rotate(-90deg) scale(.4)}
[data-theme="dark"] .theme-toggle .sun{opacity:0;transform:rotate(90deg) scale(.4)}
[data-theme="dark"] .theme-toggle .moon{opacity:1;transform:none}

/* Форма */
form{padding:clamp(18px,4vw,32px)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.form-group{margin-bottom:20px;min-width:0}
label{display:block;margin-bottom:7px;font-weight:600;font-size:13.5px;color:var(--label)}
label .req{color:var(--danger)}
.field{position:relative}
input,textarea{
  width:100%; padding:12px 14px; font-size:15px; font-family:inherit; color:var(--text);
  min-height:46px;
  border:1.5px solid var(--border); border-radius:12px; background:var(--input-bg); outline:none;
  transition:border-color .2s, box-shadow .2s, background .2s, color .3s;
}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.75}
input:focus,textarea:focus{border-color:var(--primary);background:var(--input-focus);box-shadow:0 0 0 4px var(--ring)}
textarea{resize:vertical;min-height:120px;line-height:1.45}
.has-error input,.has-error textarea{border-color:var(--danger);background:var(--danger-bg)}
.has-error input:focus,.has-error textarea:focus{box-shadow:0 0 0 4px rgba(239,68,68,.18)}
.is-valid input,.is-valid textarea{border-color:var(--ok)}
.error-msg{display:none;margin-top:6px;font-size:12.5px;color:var(--danger);font-weight:500;line-height:1.35}
.has-error>.error-msg{display:block}
.hint{margin-top:5px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.counter{font-size:12px;color:var(--muted);font-weight:500}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.contract-item{margin-bottom:10px}
.contract-row{display:flex;gap:8px;animation:slideIn .25s ease}
.contract-row .cell{flex:1;min-width:0}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

.btn{
  border:none;cursor:pointer;font-family:inherit;font-weight:600;border-radius:12px;
  transition:transform .1s, box-shadow .2s, background .2s, opacity .2s;
}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.btn-primary{
  width:100%;padding:15px 20px;font-size:16px;color:#fff;min-height:50px;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  box-shadow:0 10px 24px rgba(99,102,241,.38);
}
.btn-primary:hover{box-shadow:0 12px 30px rgba(99,102,241,.55)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}
.btn-add{padding:11px 16px;font-size:14px;min-height:44px;background:var(--chip-bg);color:var(--chip-text)}
.btn-add:hover{background:var(--chip-bg-hover)}
.btn-add:disabled{opacity:.5;cursor:not-allowed}
.btn-remove{flex:0 0 46px;min-height:46px;background:var(--remove-bg);color:var(--remove-text);font-size:16px}
.btn-remove:hover{background:var(--remove-hover)}
.btn-ghost{padding:13px 18px;min-height:48px;background:var(--ghost-bg);color:var(--ghost-text)}
.btn-ghost:hover{background:var(--ghost-hover)}

/* Окна */
.overlay{
  position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(5px);
  display:none;align-items:center;justify-content:center;padding:16px;z-index:50;
}
.overlay.open{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--card);color:var(--text);border:1px solid var(--border);
  border-radius:20px;width:100%;max-width:500px;max-height:90vh;max-height:90dvh;overflow:auto;
  padding:clamp(20px,5vw,28px);box-shadow:0 30px 70px rgba(0,0,0,.45);animation:pop .25s ease;
}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
@keyframes sheet{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.modal h3{margin:0 0 14px;font-size:20px}
.modal .icon{
  width:64px;height:64px;border-radius:50%;margin:0 auto 14px;display:flex;
  align-items:center;justify-content:center;font-size:32px;color:#fff;font-weight:700;
}
.icon.ok{background:var(--ok)} .icon.err{background:var(--danger)}
.center{text-align:center}
.modal p{color:var(--muted);margin:0 0 20px;line-height:1.45}
.summary{background:var(--summary-bg);border:1px solid var(--border);border-radius:14px;padding:4px 16px;margin-bottom:18px}
.summary .row{padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
.summary .row:last-child{border-bottom:none}
.summary .k{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:2px}
.summary .v{word-break:break-word;white-space:pre-wrap}
.modal-actions{display:flex;gap:10px}
.modal-actions .btn{flex:1;width:auto}
.spinner{
  width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;
  border-radius:50%;display:inline-block;vertical-align:-3px;margin-right:8px;animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Уведомления */
#toasts{
  position:fixed;top:max(16px,env(safe-area-inset-top));right:16px;left:16px;z-index:100;
  display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:none;
}
.toast{
  background:#1e293b;color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;max-width:420px;
  box-shadow:0 10px 30px rgba(0,0,0,.3);border-left:4px solid var(--primary);animation:slideT .3s ease;
  pointer-events:auto;
}
[data-theme="dark"] .toast{background:#262f4d;border:1px solid #36416a;border-left:4px solid var(--primary)}
.toast.error{border-left-color:var(--danger)} .toast.success{border-left-color:var(--ok)}
@keyframes slideT{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}

/* Адаптивность */
@media (max-width:640px){
  .grid-2{grid-template-columns:1fr}
  input,textarea{font-size:16px} /* без авто-зума в iOS */
}
@media (max-width:520px){
  body{align-items:flex-start}
  .container{margin:0 auto}
  .overlay{align-items:flex-end;padding:0}
  .modal{
    max-width:100%;border-radius:22px 22px 0 0;animation:sheet .3s ease;
    padding-bottom:max(20px, env(safe-area-inset-bottom));
  }
  .modal-actions{flex-direction:column-reverse}
  #toasts{align-items:stretch}
  .toast{max-width:none}
}
@media (min-width:1100px){
  .container{max-width:760px}
}
@media (max-height:520px) and (orientation:landscape){
  .overlay{align-items:center;padding:8px}
  .modal{border-radius:18px;max-height:96dvh}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 14v-2a9 9 0 0 1 18 0v2"/>
        <path d="M21 15a2 2 0 0 1-2 2h-1v-5h1a2 2 0 0 1 2 2zM3 15a2 2 0 0 0 2 2h1v-5H5a2 2 0 0 0-2 2z"/>
        <path d="M21 17v1a3 3 0 0 1-3 3h-4"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>Новое обращение КЦ</h1>
      <p>Заполните данные — карточка будет создана и отправлена в Telegram</p>
    </div>
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Переключить тему" title="Светлая / тёмная тема">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
    </button>
  </header>

  <form id="supportForm" novalidate>
    <div class="grid-2">
      <div class="form-group" data-field="applicant">
        <label for="applicant">Заявитель <span class="req">*</span></label>
        <div class="field"><input type="text" id="applicant" autocomplete="off" placeholder="ФИО"></div>
        <div class="error-msg"></div>
      </div>

      <div class="form-group" data-field="phone">
        <label for="phone">Номер телефона <span class="req">*</span></label>
        <div class="field"><input type="tel" id="phone" inputmode="tel" autocomplete="off" placeholder="  "></div>
        <div class="error-msg"></div>
      </div>
    </div>

    <div class="form-group" id="contractsGroup">
      <label>Номер договора <span class="req">*</span> <span class="counter" id="contractsCount"></span></label>
      <div id="contractsContainer"></div>
      <button type="button" class="btn btn-add" id="addContractBtn">＋ Добавить договор</button>
    </div>

    <div class="form-group" data-field="legalName">
      <label for="legalName">Юр. название партнера <span class="req">*</span></label>
      <div class="field"><input type="text" id="legalName" autocomplete="off" placeholder="  "></div>
      <div class="error-msg"></div>
    </div>

    <div class="form-group" data-field="description">
      <label for="description">Описание <span class="req">*</span></label>
      <div class="field"><textarea id="description" placeholder="Суть обращения..."></textarea></div>
      <div class="error-msg"></div>
      <div class="hint"><span>Минимум 10 символов</span><span id="descCounter">0 / 1000</span></div>
    </div>

    <div class="form-group" data-field="creator">
      <label for="creator">Создатель (ФИО / Telegram) <span class="req">*</span></label>
      <div class="field"><input type="text" id="creator" autocomplete="off" placeholder="@username или ФИО оператора"></div>
      <div class="error-msg"></div>
    </div>

    <button type="submit" class="btn btn-primary" id="submitBtn">Проверить и отправить</button>
  </form>
</div>

<!-- Подтверждение -->
<div class="overlay" id="confirmModal">
  <div class="modal">
    <h3>Проверьте данные</h3>
    <div class="summary" id="summary"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="cancelBtn">Назад</button>
      <button type="button" class="btn btn-primary" id="confirmBtn">Отправить</button>
    </div>
  </div>
</div>

<!-- Результат -->
<div class="overlay" id="resultModal">
  <div class="modal center">
    <div class="icon" id="resultIcon"></div>
    <h3 id="resultTitle"></h3>
    <p id="resultText"></p>
    <div class="modal-actions"><button type="button" class="btn btn-primary" id="resultOk">Понятно</button></div>
  </div>
</div>

<div id="toasts" aria-live="polite"></div>

<script>
// URL веб-приложения Google Apps Script
const API_URL = 'https://script.google.com/macros/s/AKfycbyK7uM1brCri6aM7SEjrtjin3Bgsn_6aAW0ANNxqc2wKAnErchk6OMcyZkD5tUfmTx6/exec';
const MAX_CONTRACTS = 10;
const DRAFT_KEY = 'kc_form_draft_v1';
const THEME_KEY = 'kc_theme';
const COOLDOWN_MS = 5000;

const $ = (id) => document.getElementById(id);
const els = {
  form: $('supportForm'), applicant: $('applicant'), phone: $('phone'),
  legalName: $('legalName'), description: $('description'), creator: $('creator'),
  container: $('contractsContainer'), addBtn: $('addContractBtn'),
  submitBtn: $('submitBtn'), confirmBtn: $('confirmBtn')
};
let lastSentAt = 0, sending = false;

/* ---------- Тема ---------- */
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#0b1020' : '#6366f1');
  $('themeToggle').setAttribute('aria-pressed', String(t === 'dark'));
}
applyTheme(document.documentElement.getAttribute('data-theme') || 'light');
$('themeToggle').addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch (_) {}
});
// Если пользователь не выбирал тему вручную — следуем системной
if (window.matchMedia) {
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
    let saved = null; try { saved = localStorage.getItem(THEME_KEY); } catch (_) {}
    if (!saved) applyTheme(e.matches ? 'dark' : 'light');
  });
}

/* ---------- Утилиты ---------- */
function toast(msg, type = 'info') {
  const t = document.createElement('div');
  t.className = 'toast ' + type; t.textContent = msg;
  $('toasts').appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 300); }, 3500);
}
function openModal(id) { $(id).classList.add('open'); }
function closeModal(id) { $(id).classList.remove('open'); }
function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const clean = (s) => s.replace(/\s+/g, ' ').trim();

/* ---------- Подсветка ошибок ---------- */
function setError(group, msg) {
  const box = group.querySelector('.error-msg');
  if (msg) {
    group.classList.add('has-error'); group.classList.remove('is-valid');
    box.textContent = msg;
  } else {
    group.classList.remove('has-error'); group.classList.add('is-valid');
    box.textContent = '';
  }
  return !msg;
}

/* ---------- Правила валидации ---------- */
const validators = {
  applicant(v) {
    v = clean(v);
    if (!v) return 'Укажите ФИО заявителя';
    if (!/^[A-Za-zА-Яа-яЁёЎўҚқҒғҲҳ'’`\-\s.]+$/.test(v)) return 'ФИО может содержать только буквы, пробел, дефис';
    if (v.split(' ').filter(w => w.length > 1).length < 2) return 'Введите минимум фамилию и имя';
    if (v.length > 100) return 'Слишком длинное значение (макс. 100)';
    return '';
  },
  phone(v) {
    const d = v.replace(/\D/g, '');
    if (!d) return 'Укажите номер телефона';
    if (!d.startsWith('998')) return 'Номер должен начинаться с +998';
    if (d.length < 12) return 'Номер неполный: нужно 9 цифр после +998';
    if (d.length > 12) return 'Слишком много цифр';
    if (/^998[01]/.test(d)) return 'Код оператора указан неверно';
    if (/^(\d)\1+$/.test(d.slice(3))) return 'Номер выглядит некорректно';
    return '';
  },
  legalName(v) {
    v = clean(v);
    if (!v) return 'Укажите юр. название';
    if (v.length < 2) return 'Минимум 2 символа';
    if (v.length > 150) return 'Слишком длинное значение (макс. 150)';
    if (!/[A-Za-zА-Яа-яЁё]/.test(v)) return 'Название должно содержать буквы';
    return '';
  },
  description(v) {
    v = v.trim();
    if (!v) return 'Опишите суть обращения';
    if (v.length < 10) return `Слишком коротко: ещё ${10 - v.length} симв. (минимум 10)`;
    if (v.length > 1000) return 'Максимум 1000 символов';
    if (/^(.)\1+$/.test(v.replace(/\s/g, ''))) return 'Описание выглядит некорректно';
    return '';
  },
  creator(v) {
    v = clean(v);
    if (!v) return 'Укажите создателя';
    if (v.startsWith('@')) {
      if (!/^@[A-Za-z][A-Za-z0-9_]{4,31}$/.test(v))
        return 'Telegram-ник: 5–32 символа, латиница, цифры, «_», начинается с буквы';
      return '';
    }
    if (!/^[A-Za-zА-Яа-яЁёЎўҚқҒғҲҳ'’`\-\s.]+$/.test(v)) return 'Введите ФИО (буквы) или @username';
    if (v.length < 3) return 'Минимум 3 символа';
    return '';
  }
};
const contractRe = /^\d{3,40}$/;

function validateField(name) {
  const group = document.querySelector(`[data-field="${name}"]`);
  return setError(group, validators[name](els[name].value));
}

function validateContracts() {
  const rows = [...els.container.querySelectorAll('.contract-item')];
  const seen = new Set(); let ok = true;
  rows.forEach(item => {
    const v = item.querySelector('input').value.trim(); let msg = '';
    if (!v) msg = 'Введите номер договора';
    else if (!contractRe.test(v)) msg = 'Только цифры';
    else if (seen.has(v)) msg = 'Такой номер уже добавлен';
    if (!msg) seen.add(v); else ok = false;
    setError(item, msg);
  });
  return ok && seen.size > 0;
}

/* ---------- Договоры ---------- */
function updateContractsUi() {
  const n = els.container.children.length;
  $('contractsCount').textContent = `(${n} из ${MAX_CONTRACTS})`;
  els.addBtn.disabled = n >= MAX_CONTRACTS;
  els.container.querySelectorAll('.btn-remove').forEach(b => b.style.visibility = n > 1 ? 'visible' : 'hidden');
}
function addContractField(value = '', focus = true) {
  if (els.container.children.length >= MAX_CONTRACTS) {
    toast(`Максимум ${MAX_CONTRACTS} договоров`, 'error'); return;
  }
  const item = document.createElement('div');
  item.className = 'contract-item';
  item.innerHTML = `
    <div class="contract-row">
      <div class="cell field"><input type="text" class="contract-input" inputmode="numeric" pattern="[0-9]*" maxlength="40" autocomplete="off" placeholder=" "></div>
      <button type="button" class="btn btn-remove" title="Удалить" aria-label="Удалить договор">✕</button>
    </div>
    <div class="error-msg"></div>`;
  const input = item.querySelector('input');
  input.value = String(value).replace(/\D/g, '');
  els.container.appendChild(item);
  updateContractsUi();
  if (focus) input.focus();
}
els.addBtn.addEventListener('click', () => {
  const inputs = els.container.querySelectorAll('.contract-input');
  const last = inputs[inputs.length - 1];
  if (last && !last.value.trim()) {
    setError(last.closest('.contract-item'), 'Сначала заполните этот номер');
    last.focus(); return;
  }
  addContractField();
});
els.container.addEventListener('click', (e) => {
  const btn = e.target.closest('.btn-remove');
  if (!btn || els.container.children.length <= 1) return;
  btn.closest('.contract-item').remove(); updateContractsUi(); saveDraft();
});
els.container.addEventListener('input', (e) => {
  if (e.target.classList.contains('contract-input')) {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 40); // только цифры
    const item = e.target.closest('.contract-item');
    if (item.classList.contains('has-error')) validateContracts();
    saveDraft();
  }
});
els.container.addEventListener('blur', (e) => {
  if (e.target.classList.contains('contract-input') && e.target.value) validateContracts();
}, true);

/* ---------- Маска телефона ---------- */
function formatPhone(raw) {
  let d = raw.replace(/\D/g, '');
  if (d.startsWith('998')) d = d.slice(3);
  else if (d.startsWith('8') && d.length > 9) d = d.slice(1);
  d = d.slice(0, 9);
  let out = '+998';
  if (d.length) out += ' ' + d.slice(0, 2);
  if (d.length > 2) out += ' ' + d.slice(2, 5);
  if (d.length > 5) out += ' ' + d.slice(5, 7);
  if (d.length > 7) out += ' ' + d.slice(7, 9);
  return d.length || raw.length ? out : '';
}
els.phone.addEventListener('input', () => { els.phone.value = formatPhone(els.phone.value); });
els.phone.addEventListener('focus', () => { if (!els.phone.value) els.phone.value = '+998 '; });
els.phone.addEventListener('blur', () => { if (els.phone.value.trim() === '+998') els.phone.value = ''; });

/* ---------- Живая валидация и счётчик ---------- */
['applicant','phone','legalName','description','creator'].forEach(name => {
  const group = document.querySelector(`[data-field="${name}"]`);
  els[name].addEventListener('blur', () => { if (els[name].value || group.classList.contains('has-error')) validateField(name); });
  els[name].addEventListener('input', () => {
    if (group.classList.contains('has-error')) validateField(name);
    if (name === 'description') $('descCounter').textContent = `${els.description.value.length} / 1000`;
    saveDraft();
  });
});

/* ---------- Черновик ---------- */
function saveDraft() {
  try {
    localStorage.setItem(DRAFT_KEY, JSON.stringify({
      applicant: els.applicant.value, phone: els.phone.value, legalName: els.legalName.value,
      description: els.description.value, creator: els.creator.value,
      contracts: [...els.container.querySelectorAll('.contract-input')].map(i => i.value)
    }));
  } catch (_) {}
}
function loadDraft() {
  try {
    const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
    if (!d) return false;
    ['applicant','phone','legalName','description','creator'].forEach(k => els[k].value = d[k] || '');
    (d.contracts && d.contracts.length ? d.contracts : ['']).slice(0, MAX_CONTRACTS).forEach(c => addContractField(c, false));
    $('descCounter').textContent = `${els.description.value.length} / 1000`;
    const any = ['applicant','phone','legalName','description','creator'].some(k => (d[k] || '').trim() && d[k].trim() !== '+998')
      || (d.contracts || []).some(Boolean);
    if (any) toast('Восстановлен несохранённый черновик');
    return true;
  } catch (_) { return false; }
}
function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (_) {} }

/* ---------- Отправка ---------- */
function collectData() {
  const seen = new Set();
  const contracts = [...els.container.querySelectorAll('.contract-input')]
    .map(i => i.value.trim()).filter(v => v && !seen.has(v) && seen.add(v));
  return {
    applicant: clean(els.applicant.value),
    phone: '+' + els.phone.value.replace(/\D/g, ''),
    contracts,
    legalName: clean(els.legalName.value),
    description: els.description.value.trim(),
    creator: clean(els.creator.value)
  };
}

els.form.addEventListener('submit', (e) => {
  e.preventDefault();
  if (sending) return;
  const results = ['applicant','phone','legalName','description','creator'].map(validateField);
  results.push(validateContracts());
  if (results.includes(false)) {
    const firstBad = document.querySelector('.has-error');
    if (firstBad) {
      firstBad.scrollIntoView({behavior:'smooth', block:'center'});
      firstBad.classList.add('shake'); setTimeout(() => firstBad.classList.remove('shake'), 450);
      const inp = firstBad.querySelector('input,textarea'); if (inp) inp.focus({preventScroll:true});
    }
    toast('Исправьте ошибки в форме', 'error'); return;
  }
  const left = COOLDOWN_MS - (Date.now() - lastSentAt);
  if (left > 0) { toast(`Подождите ${Math.ceil(left / 1000)} сек. перед повторной отправкой`, 'error'); return; }

  const d = collectData();
  $('summary').innerHTML = [
    ['Заявитель', d.applicant], ['Телефон', d.phone], ['Договоры', d.contracts.join(', ')],
    ['Юр. название', d.legalName], ['Описание', d.description], ['Создатель', d.creator]
  ].map(([k, v]) => `<div class="row"><span class="k">${k}</span><span class="v">${escapeHtml(v)}</span></div>`).join('');
  openModal('confirmModal');
});

$('cancelBtn').addEventListener('click', () => closeModal('confirmModal'));
els.confirmBtn.addEventListener('click', async () => {
  if (sending) return;
  sending = true;
  els.confirmBtn.disabled = true;
  els.confirmBtn.innerHTML = '<span class="spinner"></span>Отправка...';
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 20000);
  try {
    await fetch(API_URL, {
      method: 'POST', mode: 'no-cors', signal: ctrl.signal,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(collectData())
    });
    lastSentAt = Date.now();
    closeModal('confirmModal');
    showResult(true, 'Обращение отправлено', 'Карточка создана и отправлена в Telegram.');
    resetForm();
  } catch (err) {
    closeModal('confirmModal');
    const msg = err.name === 'AbortError' ? 'Превышено время ожидания. Проверьте интернет и попробуйте ещё раз.' : 'Ошибка соединения: ' + err.message;
    showResult(false, 'Не удалось отправить', msg);
  } finally {
    clearTimeout(timer); sending = false;
    els.confirmBtn.disabled = false; els.confirmBtn.textContent = 'Отправить';
  }
});

function showResult(ok, title, text) {
  const icon = $('resultIcon');
  icon.className = 'icon ' + (ok ? 'ok' : 'err');
  icon.textContent = ok ? '✓' : '!';
  $('resultTitle').textContent = title; $('resultText').textContent = text;
  openModal('resultModal');
}
$('resultOk').addEventListener('click', () => closeModal('resultModal'));

function resetForm() {
  els.form.reset(); clearDraft();
  document.querySelectorAll('.has-error,.is-valid').forEach(n => n.classList.remove('has-error','is-valid'));
  els.container.innerHTML = ''; addContractField('', false);
  $('descCounter').textContent = '0 / 1000';
}

/* Закрытие окон: клик по фону и Esc */
document.querySelectorAll('.overlay').forEach(o => o.addEventListener('mousedown', (e) => {
  if (e.target === o && !sending) closeModal(o.id);
}));
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !sending) document.querySelectorAll('.overlay.open').forEach(o => closeModal(o.id));
});

/* ---------- Старт ---------- */
if (!loadDraft() || !els.container.children.length) addContractField('', false);
updateContractsUi();
</script>
</body>
</html>
